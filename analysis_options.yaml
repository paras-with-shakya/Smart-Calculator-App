# Analyzer and lint configuration for the whole workspace. packages/calc_engine
# has no analysis_options.yaml of its own, so it uses this file too.
# Run `flutter analyze` from the project root; it must report no issues.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Importing a package that is not declared in the importing package's own
    # pubspec is an error. In a pub workspace every package shares one package
    # config, so this is what stops calc_engine from using Flutter.
    depend_on_referenced_packages: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_type_to_string
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - test_types_in_equals
    - throw_in_finally
    - type_annotate_public_apis
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_colored_box
    - use_decorated_box
    - use_named_constants
