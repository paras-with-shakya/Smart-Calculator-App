name: smart_calculator
description: "Smart Calculator: a modular, offline-first calculator app built with Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Pub workspace: packages resolve together and share one pubspec.lock.
workspace:
  - packages/calc_engine

# Every dependency must be verified for compatibility and maintenance before
# it is added (docs/DECISIONS.md, DEC-015).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  # Version pinned by flutter_localizations.
  intl: any
  path: ^1.9.1
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory preferences backend for tests.
  shared_preferences_platform_interface: ^2.4.2
  # SQLite on the host machine for database tests.
  sqflite_common_ffi: ^2.4.3

flutter:
  # Generates lib/l10n/app_localizations*.dart from the ARB files (l10n.yaml).
  generate: true
  uses-material-design: true
